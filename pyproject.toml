[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-im"
version = "0.3.0"
description = "Snapshot government policy pages, diff them section by section, and answer questions with citations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Louis" }]
keywords = ["rag", "retrieval", "change-detection", "data-engineering", "immigration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
]

[project.scripts]
rag-im = "rag_im.cli:main"

[project.urls]
Homepage = "https://github.com/SleepAqua/rag_im"
Issues = "https://github.com/SleepAqua/rag_im/issues"

[tool.setuptools]
packages = ["rag_im"]
